version: '3.8'
services:
  db:
    image: postgres:14-alpine 
    restart: always
    environment:
      POSTGRES_USER: ${postgres}       
      POSTGRES_PASSWORD: ${Carlos22}
      POSTGRES_DB: ${ecommerce}
    ports:
      - "5432:5432" 
    volumes:
      - db-data:/var/lib/postgresql/data 

volumes:
  db-data:
    driver: local